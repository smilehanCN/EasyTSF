model:
  model_name: iTransformer
  output_attention: false
  d_model: 256
  d_ff: 256
  dropout: 0.3
  factor: 3
  n_heads: 8
  activation: gelu
  e_layers: 2
data:
  dataset_name: ECL
  hist_len: 96
  pred_len: 336
train:
  batch_size: 32
  max_epochs: 20
  lr: 0.0001
  lr_scheduler: WSD
  lr_warmup_end_epochs: 5
  lr_stable_end_epochs: 10
  es_patience: 20
