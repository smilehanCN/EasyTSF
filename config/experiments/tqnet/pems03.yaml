# model
model: TQNet
cycle: 288
cycle_feature_name: "time of day"
d_model: 512
dropout: 0.0
use_revin: false
use_tq: true
channel_aggre: true
channel_aggre_heads: 4

# data
dataset: PEMS03
hist_len: 96
pred_len: 12
var_num: 358
time_feature_descriptions:
  - time of day

# train
seed: 42
batch_size: 32
max_epochs: 30
lr: 0.003
lr_scheduler: OneCycleLR
lrs_pct_start: 0.3
es_patience: 5
optimizer: Adam
gradient_clip_val: 0.0
gradient_clip_algorithm: norm
val_metric: val/loss
test_metric_space: original

# runtime
task: mtsf
num_workers: 2
pin_memory: null
persistent_workers: null
prefetch_factor: 2
use_mmap: false
data_root: dataset
save_root: checkpoint
devices: [0]
