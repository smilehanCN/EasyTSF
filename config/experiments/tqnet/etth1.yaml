# model
model_name: TQNet
cycle: 24
cycle_feature_name: "time of day"
d_model: 512
dropout: 0.0
use_revin: true
use_tq: true
channel_aggre: true
channel_aggre_heads: 4

# data
dataset_name: ETTh1
hist_len: 96
pred_len: 96
var_num: 7
time_feature_descriptions:
  - time of day

# train
seed: 42
batch_size: 128
max_epochs: 30
lr: 0.0001
lr_scheduler: OneCycleLR
lrs_pct_start: 0.3
es_patience: 5
optimizer: Adam
gradient_clip_val: 1.0
gradient_clip_algorithm: norm
val_metric: val/loss
use_mix_loss: true
test_metric_space: scaled

# runtime
task_name: mtsf
num_workers: 2
pin_memory: null
persistent_workers: null
prefetch_factor: 2
use_mmap: false
data_root: dataset
save_root: checkpoint
devices: [0]
