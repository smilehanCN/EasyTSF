model:
  model_name: TQNet
  cycle: 144
  cycle_feature_name: 'time of day'
  d_model: 512
  dropout: 0.0
  use_revin: true
  use_tq: true
  channel_aggre: true
  channel_aggre_heads: 4
data:
  dataset_name: Weather
  hist_len: 96
  pred_len: 96
train:
  batch_size: 128
  max_epochs: 30
  lr: 0.0001
