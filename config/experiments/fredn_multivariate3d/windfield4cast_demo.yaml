# model
model: fredn_multivariate3d
in_channels: 3
embed_size: 32
hidden_size: 64
hidden_layers: 2
dropout: 0.1
use_revin: true
revin_affine: true
revin_subtract_last: false
voxel_chunk_size: 4096
spatial_downsample_factor_3d: [4, 4, 4]

# data
dataset: WindFieldDemo
hist_len: 5
pred_len: 1
use_coords: false
train_patch_shape: [160, 160, 80]
eval_tile_shape: [160, 160, 80]
eval_tile_overlap: [32, 32, 16]

# train
seed: 42
batch_size: 1
max_epochs: 5
lr: 0.0001
lr_scheduler: StepLR
lr_step_size: 1
lr_gamma: 1.0
es_patience: 3
optimizer: Adam
gradient_clip_val: 0.0
gradient_clip_algorithm: norm
val_metric: val/loss
test_metric_space: original

# runtime
task: grid3d_forecasting
num_workers: 0
pin_memory: null
persistent_workers: null
prefetch_factor: 2
use_mmap: true
data_root: dataset
save_root: checkpoint
devices: auto
