model:
  model_name: CoRA
  foundation_model: MOMENT
  moment_model_name_or_path: AutonLab/MOMENT-1-small
  freeze_encoder: true
  freeze_embedder: true
  freeze_head: false
  plugin_dim: 512
  num_before: 3
  num_after: 4
  beta: 0.2
  dropout: 0.2
  head_dropout: 0.1
  plugin_lr: 0.0001
  backbone_lr: 0.00005
  gama: 0.001
  K: 3
  de: 4
  thresold: 0.3
data:
  dataset_name: ETTm2
  hist_len: 384
  pred_len: 96
train:
  batch_size: 32
  max_epochs: 10
  lr: 0.0001
  optimizer: Adam
  aux_loss_weight: 1.0
