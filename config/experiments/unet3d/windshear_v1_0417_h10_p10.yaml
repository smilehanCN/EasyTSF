# model
model: unet3d
base_channels: 16
patch_size: [4, 4, 2]
io_downsample_scale: [4, 4, 1]
downsample_scale: [2, 2, 2]
downsample_scales:
  - [2, 2, 2]
  - [2, 2, 2]
  - [1, 1, 1]
kernel_size: [3, 3, 3]
expansion: 2
use_coords: true

# data
dataset: WindStear_V1_0417
hist_len: 10
pred_len: 10
grid_spacing_m: [10.0, 10.0, 10.0]

# train
seed: 42
batch_size: 4
max_epochs: 50
lr: 0.0001
lr_scheduler: StepLR
lr_step_size: 1
lr_gamma: 1.0
es_patience: 50
optimizer: Adam
gradient_clip_val: 0.0
gradient_clip_algorithm: norm
shear_loss_weight: 0.5
val_metric: val/loss
test_metric_space: original

# runtime
task: grid3d_forecasting
num_workers: 2
pin_memory: true
persistent_workers: true
prefetch_factor: 2
use_mmap: true
data_root: dataset
save_root: checkpoint/windshear_v1_0417_h10_p10_unet3d
accelerator: gpu
devices: 2
strategy: ddp
precision: bf16-mixed
check_val_every_n_epoch: 5
num_sanity_val_steps: 0
