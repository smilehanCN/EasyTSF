# model
model: patchstg_flat3d
output_mode: classification
risk_num_classes: 3
risk_num_heads: 4
in_channels: 3
coord_channels: 3
patch_size_3d: [4, 4, 4]
embed_dim: 64
depth: 2
num_heads: 4
mlp_ratio: 2.0
dropout: 0.1
use_coords: true
spatial_downsample_factor_3d: [4, 4, 4]

# data
dataset: WindFieldV1_0414
hist_len: 5
pred_len: 1
train_patch_shape: [160, 160, 80]
eval_tile_shape: [160, 160, 80]
eval_tile_overlap: [32, 32, 16]
risk_bins:
  speed: [8.0, 16.0]
  shear_x: [2.0, 5.0]
  shear_y: [2.0, 5.0]
  shear_z: [2.0, 5.0]

# train
seed: 42
batch_size: 4
max_epochs: 30
lr: 0.0001
lr_scheduler: StepLR
lr_step_size: 1
lr_gamma: 1.0
es_patience: 30
optimizer: Adam
gradient_clip_val: 0.0
gradient_clip_algorithm: norm
val_metric: val/loss
head_loss_weights: [1.0, 1.0, 1.0, 1.0]
risk_class_weights: [1.0, 1.0, 1.0]

# runtime
task: grid3d_risk_prediction
num_workers: 2
pin_memory: true
persistent_workers: true
prefetch_factor: 2
use_mmap: true
data_root: dataset
save_root: checkpoint/grid3d_risk_v1_0414
accelerator: gpu
devices: 4
strategy: ddp_find_unused_parameters_true
