# Task-oriented planning stub for future graph prediction support.

# model
model: YourGraphModel
# add graph-specific keys here

# data
dataset: YourGraphDataset
hist_len: 12
pred_len: 12
var_num: 1
# example task-specific keys:
# graph_topology: graph.npy
# use_node_features: true
# use_edge_features: false

# train
seed: 42
batch_size: 32
max_epochs: 30
lr: 0.001
lr_scheduler: OneCycleLR
lrs_pct_start: 0.3
es_patience: 5
optimizer: Adam
gradient_clip_val: 0.0
gradient_clip_algorithm: norm
val_metric: val/loss
test_metric_space: original

# runtime
task: graph_prediction
num_workers: 2
data_root: dataset
save_root: checkpoint
devices: auto
