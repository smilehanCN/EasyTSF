[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easytsfnext"
version = "0.1.0"
description = "Lightweight forecasting research toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "lightning>=2.6.0",
    "ray[tune]>=2.54.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["easytsf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
